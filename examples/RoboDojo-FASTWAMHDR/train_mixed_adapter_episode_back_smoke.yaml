task: train

runner:
  class_path: lightewm.runner.fastwam.FastWAMRunner
  params:
    fastwam_root: lightewm/vendor/fastwam
    output_path: ./logs/train/MixedAdapter-FASTWAMHDR-smoke
    run_name: smoke_vis_20260714
    num_processes: 16
    zero_stage: 1

    fastwam_task: robotwin_uncond_3cam_384_1e-4
    fastwam_model: fastwam_joint_adapter
    fastwam_data: mixed_adapter_cache

    model_id: Wan-AI/Wan2.2-TI2V-5B
    tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
    video_dit_pretrained_path: checkpoints/Wan2.2-5B-Robot/checkpoint.safetensors
    action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22Robot_alphascale_1024hdim.pt

    hydra_overrides:
      - batch_size=1
      - num_workers=0
      - model.redirect_common_files=false
      - model.mot_checkpoint_mixed_attn=false
      - model.action_attend_video=local_clean_first
      - model.hdr_mode=episode_back_mixed
      - lr_scheduler_type=cosine
      - learning_rate=1e-4
      - num_epochs=1
      - max_steps=2
      - log_every=1
      - save_every=0
      - eval_every=1
      - +smoke_eval_step=1
      - eval_num_inference_steps=2
      - gradient_accumulation_steps=1
      - weight_decay=1e-2
      - mixed_precision=bf16
      - max_grad_norm=1.0
      - wandb.enabled=false
      - data.train.latent_cache_dir=../../../data/mixed_adapter_episode_back_smoke_vis_20260714
      - data.train.index_file=../../../data/mixed_adapter_episode_back_smoke_vis_20260714/train_indices.pt
      - data.train.text_embedding_cache_dir=../../../data/text_embeds_cache/mixed_adapter_episode_back_smoke_vis_20260714
      - data.train.dataset_dirs=[../../../data/mixed_adapter_episode_back_smoke_vis_20260714/prompt_dataset]
      - data.val.latent_cache_dir=../../../data/mixed_adapter_episode_back_smoke_vis_20260714
      - data.val.index_file=../../../data/mixed_adapter_episode_back_smoke_vis_20260714/val_indices.pt
      - data.val.text_embedding_cache_dir=../../../data/text_embeds_cache/mixed_adapter_episode_back_smoke_vis_20260714
      - data.val.dataset_dirs=[../../../data/mixed_adapter_episode_back_smoke_vis_20260714/prompt_dataset]
      - data.val.require_video=true
