name: fastwam-libero-step-043400
family: fastwam
checkpoint:
  format: state_dict
  uri: s3://verdent.tech/zhangyu/test_robot_trial/fastwam_training_runs/formal_4gpu_10epoch_20260630/checkpoints/weights/step_043400.pt
  backbone_uri: Wan-AI/Wan2.2-TI2V-5B
  config_uri: configs/task/libero_joint_2cam224_1e-4.yaml
