name: robotwin-scripted-expert
family: robotwin-scripted-expert
checkpoint:
  format: official_script
  uri: script/collect_data.py
  config_uri: task_config/_embodiment_config.yml
runtime:
  mode: local
  environment: robotwin-sim
observations:
  cam_high:
    shape: [256, 320, 3]
    dtype: uint8
  cam_left_wrist:
    shape: [128, 160, 3]
    dtype: uint8
  cam_right_wrist:
    shape: [128, 160, 3]
    dtype: uint8
  proprio:
    shape: [14]
    dtype: float32
    semantics: dual_arm_qpos
action:
  shape: [1, 14]
  dtype: float32
  semantics: dual_arm_joint_position
action_chunk_size: 1
execution_horizon: 1
metadata:
  authority: RoboTwin official scripted expert and success checker
