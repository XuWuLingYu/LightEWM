train:
  _target_: fastwam.datasets.lerobot.latent_cache_dataset.FastWAMLatentCacheDataset
  latent_cache_dir: ./data/mixed_adapter_episode_back
  index_file: ./data/mixed_adapter_episode_back/train_indices.pt
  text_embedding_cache_dir: ./data/text_embeds_cache/mixed_adapter_episode_back
